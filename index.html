<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  :root, [data-theme="midnight"] {
    --bg1:#0b0e22; --bg2:#1b2250; --blob1:rgba(110,125,255,.55); --blob2:rgba(190,90,255,.35);
    --card:rgba(255,255,255,.08); --card2:rgba(255,255,255,.06);
    --text:#f4f6ff; --muted:#a9b0d6; --accent:#8c9bff; --glow:rgba(140,155,255,.38); --panel:#151a3d;
  }
  [data-theme="sunset"] { --bg1:#240b1c; --bg2:#6b2742; --blob1:rgba(255,150,90,.5); --blob2:rgba(255,80,140,.4);
    --card:rgba(255,255,255,.10); --card2:rgba(255,255,255,.07); --text:#fff4ee; --muted:#f0b8b0; --accent:#ffb36b; --glow:rgba(255,179,107,.38); --panel:#3a1428; }
  [data-theme="forest"] { --bg1:#0a1c16; --bg2:#1c5a45; --blob1:rgba(90,230,160,.4); --blob2:rgba(40,160,120,.4);
    --card:rgba(255,255,255,.09); --card2:rgba(255,255,255,.06); --text:#eefaf4; --muted:#a6d4c1; --accent:#6be3a4; --glow:rgba(107,227,164,.38); --panel:#10302a; }
  [data-theme="ocean"] { --bg1:#06162a; --bg2:#0e5c7c; --blob1:rgba(80,200,255,.45); --blob2:rgba(60,120,255,.4);
    --card:rgba(255,255,255,.09); --card2:rgba(255,255,255,.06); --text:#eefbff; --muted:#a3d3e6; --accent:#5fd3ff; --glow:rgba(95,211,255,.38); --panel:#0a2c44; }
  [data-theme="light"] { --bg1:#eef1fb; --bg2:#cfd8f5; --blob1:rgba(120,140,255,.35); --blob2:rgba(255,160,200,.35);
    --card:rgba(255,255,255,.78); --card2:rgba(255,255,255,.62); --text:#1a2040; --muted:#55608f; --accent:#3d4fe0; --glow:rgba(61,79,224,.3); --panel:#ffffff; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--text);
    background:linear-gradient(135deg, var(--bg1), var(--bg2));
    display:flex; align-items:center; justify-content:center;
  }
  .hidden { display:none !important; }

  #aurora { position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden; pointer-events:none; z-index:0; }
  .blob { position:absolute; width:1200px; height:1200px; border-radius:50%; }
  .b1 { background:radial-gradient(circle, var(--blob1) 0%, transparent 65%); top:-400px; left:-300px; animation:d1 50s ease-in-out infinite alternate; }
  .b2 { background:radial-gradient(circle, var(--blob2) 0%, transparent 65%); bottom:-500px; right:-300px; animation:d2 65s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform:translate(500px,300px); } }
  @keyframes d2 { to { transform:translate(-500px,-250px); } }
  body.noanim .blob { animation:none; }
  .blob { will-change:transform; }
  body.busy .blob { animation-play-state:paused; }

  #stage { position:relative; z-index:1; width:1920px; height:1080px; flex:none; transform-origin:center center; overflow:hidden; }
  #shift { position:absolute; top:0; left:0; width:1920px; height:1080px; padding:54px 110px 46px;
           display:flex; flex-direction:column; transition:opacity 2s ease, transform 3s ease; }
  body.idle #shift { opacity:.16; }

  header { display:flex; justify-content:space-between; align-items:flex-start; }
  #greet { font-size:40px; color:var(--muted); margin-bottom:4px; }
  #time { font-size:176px; font-weight:200; line-height:1; letter-spacing:-4px; }
  #ampm { font-size:52px; font-weight:300; color:var(--muted); margin-left:14px; letter-spacing:0; }
  #date { font-size:40px; color:var(--muted); margin-top:6px; }

  #weather { text-align:right; background:var(--card); border-radius:36px; padding:26px 44px; min-width:540px; }
  #wRow { display:flex; justify-content:flex-end; align-items:center; }
  #wIcon { width:92px; height:92px; margin-right:26px; }
  #wIcon svg { width:92px; height:92px; display:block; }
  #wTemp { font-size:100px; font-weight:300; line-height:1; }
  #wDesc { font-size:34px; margin-top:6px; }
  #wFeels { font-size:28px; color:var(--muted); margin-top:4px; }
  #wPlace { font-size:24px; color:var(--muted); margin-top:4px; }


  #cds { display:block; margin-top:30px; flex:none; }
  .cd { background:var(--card); border-radius:26px; padding:8px 22px 10px; margin:0 14px 12px; text-align:center; }
  .cdLab { font-size:19px; color:var(--muted); letter-spacing:4px; white-space:nowrap; margin-bottom:2px; }
  .cdG { display:flex; justify-content:center; }
  .u { width:96px; text-align:center; }
  .u b { display:block; font-size:52px; font-weight:300; line-height:1.08; font-variant-numeric:tabular-nums; }
  .u i { display:block; font-style:normal; font-size:12px; letter-spacing:2px; color:var(--muted); margin-top:-2px; }
  .cdDone { display:none; font-size:44px; font-weight:300; padding:8px 0; }
  .cd.done .cdG { display:none; }
  .cd.done .cdDone { display:block; }
  #hourly { display:flex; justify-content:center; margin-top:22px; min-height:156px; }
  .hr { background:var(--card2); border-radius:24px; padding:12px 0; margin:0 6px; width:122px; text-align:center; }
  .hName { font-size:24px; color:var(--muted); white-space:nowrap; }
  .hIcon { height:48px; margin:4px 0; }
  .hIcon svg { width:48px; height:48px; }
  .hTemp { font-size:30px; }
  .hPop { font-size:20px; color:var(--muted); height:24px; }
  .fadein { animation:fcIn .8s ease; }
  @keyframes fcIn { from { opacity:0; } to { opacity:1; } }
  #forecast { display:flex; justify-content:center; margin-top:22px; min-height:156px; }
  .day { background:var(--card2); border-radius:28px; padding:12px 0; margin:0 12px; width:190px; text-align:center; }
  .dName { font-size:26px; color:var(--muted); }
  .dIcon { height:52px; margin:4px 0; }
  .dIcon svg { width:52px; height:52px; }
  .dLab { font-size:21px; color:var(--muted); white-space:nowrap; margin-bottom:4px; }
  .dTemps { font-size:28px; }
  .dTemps span { color:var(--muted); }

  main { flex:1; display:flex; align-items:center; justify-content:center; }
  .tile { position:relative; width:440px; height:320px; margin:0 22px; border-radius:44px; background:var(--card);
          color:var(--text); text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .tile .num { position:absolute; top:22px; left:30px; font-size:26px; color:var(--muted); }
  .tile .logo { width:140px; height:140px; border-radius:34px; display:flex; align-items:center; justify-content:center;
                font-size:80px; font-weight:700; color:#fff; margin-bottom:22px; }
  .tile .tname { font-size:50px; font-weight:500; }
  .tile.sm .logo { width:112px; height:112px; border-radius:28px; font-size:64px; margin-bottom:18px; }
  .tile.sm .tname { font-size:38px; }

  footer { height:84px; display:flex; justify-content:space-between; align-items:center; }
  #hint { font-size:26px; color:var(--muted); }
  #controls { display:flex; align-items:center; }
  .sw { width:50px; height:50px; padding:0; border-radius:50%; margin-left:14px; cursor:pointer; border:5px solid transparent; outline:none; }
  .sw.sel { border-color:var(--text); }
  .btn { display:inline-block; font:inherit; font-size:28px; color:var(--text); background:var(--card); border:5px solid transparent; border-radius:28px;
         padding:12px 30px; cursor:pointer; outline:none; margin-left:22px; text-decoration:none; }
  #controls .btn:first-of-type { margin-left:34px; }

  .f { outline:none; border:5px solid transparent; transition:transform .12s ease-out, border-color .12s ease-out; }
  .tile.f { border-width:6px; }
  .f:focus { transform:scale(1.07); border-color:var(--accent); box-shadow:0 0 0 7px var(--glow), 0 22px 50px rgba(0,0,0,.35); }
  .tile.f:focus { transform:scale(1.09); }
  .sw.f:focus { transform:scale(1.25); }

  .overlay { position:absolute; top:0; left:0; width:1920px; height:1080px; background:rgba(0,0,0,.62);
             display:flex; align-items:center; justify-content:center; z-index:5; }
  .box { width:1060px; background:var(--panel); border-radius:44px; padding:36px 56px; }
  .box h2 { margin:0 0 18px; font-size:50px; font-weight:400; }
  .row { display:flex; align-items:center; margin:12px 0; }
  .row.center { justify-content:center; }
  .row label { width:340px; font-size:30px; color:var(--muted); }
  .row .btn { margin:0 12px 0 0; }
  .row.center .btn { margin:0 12px; }
  .note { font-size:24px; color:var(--muted); margin:10px 0; }
  .field { font:inherit; font-size:30px; color:var(--text); background:var(--card); border:5px solid transparent; border-radius:24px;
           padding:10px 22px; width:430px; margin-right:16px; }
  .msg { font-size:24px; color:var(--muted); min-height:30px; margin:-4px 0 4px 340px; }

  .lab { font-size:30px; color:var(--muted); }


  #toast { position:absolute; left:0; right:0; bottom:150px; text-align:center; pointer-events:none; opacity:0; transition:opacity .4s ease; z-index:10; }
  #toast span { display:inline-block; font-size:32px; background:var(--panel); color:var(--text); padding:14px 34px; border-radius:30px; }
  #toast.show { opacity:1; }

  /* small QR code: scan with a phone to open the phone remote */
  #qrBox { display:flex; align-items:center; }
  #qrBox.hidden { display:none; }
  #qrLab { font-size:21px; color:var(--muted); text-align:left; margin-left:16px; line-height:1.25; }
  #qrImg { width:116px; height:116px; background:#fff; border-radius:12px; padding:6px; box-sizing:border-box; }
  #qrImg svg { width:104px; height:104px; display:block; }
</style>
</head>
<body data-theme="midnight">
<div id="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>


<div id="stage">
 <div id="shift">
  <header>
    <div>
      <div id="greet"></div>
      <div><span id="time">--:--</span><span id="ampm"></span></div>
      <div id="date"></div>
    </div>
    <div id="cds"><div class="cd" id="cd0"><div class="cdLab">GTA VI</div><div class="cdG"><div class="u"><b>--</b><i>DAYS</i></div><div class="u"><b>--</b><i>HOURS</i></div><div class="u"><b>--</b><i>MINUTES</i></div><div class="u"><b>--</b><i>SECONDS</i></div></div><div class="cdDone"></div></div><div class="cd" id="cd1"><div class="cdLab">DEVIL'S PLAN S3</div><div class="cdG"><div class="u"><b>--</b><i>DAYS</i></div><div class="u"><b>--</b><i>HOURS</i></div><div class="u"><b>--</b><i>MINUTES</i></div><div class="u"><b>--</b><i>SECONDS</i></div></div><div class="cdDone"></div></div></div>
    <div id="weather">
      <div id="wRow"><div id="wIcon"></div><div id="wTemp">--&deg;</div></div>
      <div id="wDesc">Loading weather</div>
      <div id="wFeels"></div>
      <div id="wPlace"></div>
    </div>
  </header>

  <section id="fcWrap"><div id="forecast"></div><div id="hourly" class="hidden"></div></section>
  <main id="tiles"></main>

  <footer>
    <div id="qrBox" class="hidden"><div id="qrImg"></div><div id="qrLab">Scan for<br>virtual remote</div></div>
    <div id="controls">
      <div id="swatches" style="display:flex;align-items:center"></div>
      <button class="btn f" id="setBtn" tabindex="0">Settings</button>
    </div>
  </footer>
 </div>

 <div id="panel" class="overlay hidden">
  <div class="box">
    <h2>Settings</h2>
    <div class="row"><label>City</label><input id="cityIn" class="field f" type="text" tabindex="0" placeholder="Type a city"><button class="btn f" id="cityGo" tabindex="0">Search</button></div>
    <div class="msg" id="cityMsg"></div>
    <div class="row"><label>Temperature</label><button class="btn f" id="unitsBtn" tabindex="0"></button></div>
    <div class="row"><label>Clock</label><button class="btn f" id="clockBtn" tabindex="0"></button></div>
    <div class="row"><label>Time zone</label><button class="btn f" id="tzBtn" tabindex="0"></button></div>
    <div class="row"><label>Moving background</label><button class="btn f" id="animBtn" tabindex="0"></button></div>
    <div class="row"><label>Dim when idle</label><button class="btn f" id="idleBtn" tabindex="0"></button></div>
    <div class="row" id="spRow"><label>Web player playlist</label><input id="spIn" class="field f" type="text" tabindex="0" placeholder="Paste a Spotify link"><button class="btn f" id="spGo" tabindex="0">Save</button></div>
    <div class="msg" id="spMsg"></div>
    <!-- (the two lines above are only for the web version; the TV app opens the real Spotify app) -->
    <div class="row"><button class="btn f" id="doneBtn" tabindex="0">Done</button></div>
  </div>
 </div>

 <div id="musicPanel" class="overlay hidden">
  <div class="box" style="width:1120px">
    <h2>Spotify</h2>
    <iframe id="spFrame" tabindex="0" title="Spotify player" width="100%" height="352" frameborder="0"
      allow="autoplay; encrypted-media; clipboard-write; fullscreen" style="border:0;border-radius:24px;background:#111"></iframe>
    <div class="row center" style="margin-top:20px">
      <a class="btn f" id="spOpen" tabindex="0" href="https://open.spotify.com">Open Spotify website</a>
      <button class="btn f" id="spClose" tabindex="0">Close</button>
    </div>
    <div class="note" style="text-align:center">Sign in inside the player for full songs. If the arrow keys get stuck in the player, press Back on the remote.</div>
  </div>
 </div>

 <div id="toast"><span id="toastMsg"></span></div>
</div>


<script>
(function () {

/* ---------- EDIT THESE (or use Settings on the TV) ---------- */
var DEFAULTS = { tz:"Etc/GMT+6", place:"Calgary", lat:51.05, lon:-114.07, units:"celsius", hour12:true, anim:true, idleMin:15, theme:"midnight",
                 spotify:"https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M" };
var TILES = [
  { name:"Netflix",     appId:"netflix",             url:"https://www.netflix.com",    color:"#e50914", letter:"N" },
  { name:"YouTube",     appId:"youtube.leanback.v4", url:"https://www.youtube.com/tv", color:"#ff0000", letter:"▶" },
  { name:"Prime Video", appId:"amazon",              url:"https://www.primevideo.com", color:"#00a8e1", letter:"P" },
  { name:"Viu",         appId:"com.webos.app.browser", appParams:{ target:"https://viu.to/" }, url:"https://viu.to/",            color:"#e8a317", letter:"V" },
  { name:"Spotify",     action:"music", appId:"spotify-beehive",                    color:"#1db954", letter:"S" },
  { name:"PS5",         appId:"com.webos.app.hdmi2",                                      color:"#1f4fa3", letter:"PS5", small:true }
];
var THEMES = [
  { id:"midnight", name:"Midnight", c:"#3a4aa8" }, { id:"sunset", name:"Sunset", c:"#d9674f" },
  { id:"forest",   name:"Forest",   c:"#2f9a74" }, { id:"ocean",  name:"Ocean",  c:"#2a9fcb" },
  { id:"light",    name:"Light",    c:"#e6eafc" }, { id:"auto",   name:"Auto (day/night)", c:"linear-gradient(135deg,#0f1226 50%,#5fd3ff 50%)" }
];
/* ------------------------------------------------------------ */

function $(id) { return document.getElementById(id); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function pad2(n) { return ("0" + n).slice(-2); }

var S = (function () {
  var s = {}, raw = lsGet("tvSettings");
  try { s = JSON.parse(raw || "{}"); } catch (e) {}
  var out = {};
  for (var k in DEFAULTS) { out[k] = (s && s[k] !== undefined) ? s[k] : DEFAULTS[k]; }
  return out;
})();
function save() { lsSet("tvSettings", JSON.stringify(S)); }

var overlay = null, openerId = null, lastActive = Date.now(), bootT = Date.now();

function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = "scale(" + s + ")"; }
addEventListener("resize", fit); fit();

/* ---- clock + greeting ---- */
var TZS = [ ["Etc/GMT+6", "Calgary / Alberta (UTC-6, no clock changes)"], ["America/Winnipeg", "Winnipeg"], ["America/Toronto", "Toronto"], ["America/Vancouver", "Vancouver"], ["", "Same as the TV"] ];
/* returns a Date whose local fields (getHours etc.) show the wall-clock time in the chosen time zone */
function zoned(d) {
  if (!S.tz) { return d; }
  try {
    var parts = new Intl.DateTimeFormat("en-CA", { timeZone:S.tz, hourCycle:"h23", year:"numeric", month:"numeric", day:"numeric", hour:"numeric", minute:"numeric", second:"numeric" }).formatToParts(d), o = {};
    for (var i = 0; i < parts.length; i++) { o[parts[i].type] = +parts[i].value; }
    return new Date(o.year, o.month - 1, o.day, o.hour % 24, o.minute, o.second);
  } catch (e) { return d; }
}
function timeStr(d) {
  var h = d.getHours(), m = pad2(d.getMinutes());
  if (S.hour12) { return { t:(h % 12 || 12) + ":" + m, ap:(h >= 12 ? "PM" : "AM") }; }
  return { t:pad2(h) + ":" + m, ap:"" };
}
/* countdowns (month is 0-based): GTA VI releases Nov 19, 2026; The Devil's Plan: Dead Again (season 3) premieres Nov 10, 2026 */
var CDS = [ { id:"cd0", y:2026, m:10, d:19 }, { id:"cd1", y:2026, m:10, d:10 } ];
function p2(n) { return n < 10 ? "0" + n : String(n); }
function renderCd(today) {
  /* compare wall-clock fields in UTC so a daylight-saving change can't shift the count */
  var now = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate(), today.getHours(), today.getMinutes(), today.getSeconds());
  for (var i = 0; i < CDS.length; i++) {
    var c = CDS[i], ms = Date.UTC(c.y, c.m, c.d) - now, card = $(c.id), us = card.getElementsByTagName("b");
    if (ms > 0) {
      var sec = Math.floor(ms / 1000), v = [Math.floor(sec / 86400), Math.floor(sec % 86400 / 3600), Math.floor(sec % 3600 / 60), sec % 60];
      for (var k = 0; k < 4; k++) { var t = k === 0 ? String(v[k]) : p2(v[k]); if (us[k].textContent !== t) { us[k].textContent = t; } }
      card.className = "cd";
    } else {
      var d = card.lastChild, txt = ms > -86400000 ? "Out today!" : "Out now";
      if (d.textContent !== txt) { d.textContent = txt; }
      card.className = "cd done";
    }
  }
}
function tick() {
  var d = zoned(new Date()), t = timeStr(d), h = d.getHours();
  $("time").textContent = t.t; $("ampm").textContent = t.ap; renderCd(d);
  $("date").textContent = d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  $("greet").textContent = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  if (S.theme === "auto") { applyTheme(); }
}
tick(); setInterval(tick, 1000);

/* ---- weather icons: drawn by the page, so they look the same on every TV ---- */
var CLOUD = "M20 48H46a9 9 0 0 0 0-18a13 13 0 0 0-25-3a10.5 10.5 0 0 0-1 21Z";
var WXLABEL = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
function wxKind(c) {
  if (c === 0) { return "clear"; } if (c === 1 || c === 2) { return "partly"; } if (c === 3) { return "cloud"; }
  if (c === 45 || c === 48) { return "fog"; } if (c >= 51 && c <= 55) { return "drizzle"; }
  if ((c >= 61 && c <= 65) || (c >= 80 && c <= 82)) { return "rain"; }
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) { return "snow"; }
  if (c >= 95) { return "storm"; } return "cloud";
}
function sunSvg(cx, cy, r, ray0, ray1) {
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffc83d"/>';
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
    s += '<line x1="' + (cx + c * ray0).toFixed(1) + '" y1="' + (cy + n * ray0).toFixed(1) + '" x2="' + (cx + c * ray1).toFixed(1) + '" y2="' + (cy + n * ray1).toFixed(1) +
         '" stroke="#ffc83d" stroke-width="3.5" stroke-linecap="round"/>';
  }
  return s;
}
function cloudSvg(fill, tr) { return '<path transform="' + (tr || "") + '" d="' + CLOUD + '" fill="' + fill + '" stroke="#8f9bd6" stroke-width="1.5" stroke-linejoin="round"/>'; }
function lines(ys, x1, x2, col, w) { var s = ""; for (var i = 0; i < ys.length; i++) { s += '<line x1="' + x1 + '" y1="' + ys[i] + '" x2="' + x2 + '" y2="' + ys[i] + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; } return s; }
function drops(len) {
  var s = "", xs = [26, 35, 44];
  for (var i = 0; i < 3; i++) { s += '<line x1="' + xs[i] + '" y1="' + (46 + (i % 2) * 3) + '" x2="' + (xs[i] - 3) + '" y2="' + (46 + (i % 2) * 3 + len) + '" stroke="#4fb0ff" stroke-width="3.5" stroke-linecap="round"/>'; }
  return s;
}
function wxIcon(code) {
  var k = wxKind(code), b = "";
  if (k === "clear") { b = sunSvg(32, 32, 12, 18, 26); }
  else if (k === "partly") { b = sunSvg(42, 22, 8, 12.5, 18) + cloudSvg("#e3e9ff", "translate(-3,6)"); }
  else if (k === "cloud") { b = cloudSvg("#aab5e0", "translate(14,-5) scale(.78)") + cloudSvg("#e3e9ff", "translate(0,2)"); }
  else if (k === "fog") { b = cloudSvg("#e3e9ff", "translate(0,-6)") + lines([45, 51, 57], 17, 47, "#aab5e6", 3); }
  else if (k === "drizzle") { b = cloudSvg("#d4dcf7", "translate(0,-6)") + drops(6); }
  else if (k === "rain") { b = cloudSvg("#c9d2f2", "translate(0,-6)") + drops(10); }
  else if (k === "snow") {
    b = cloudSvg("#e3e9ff", "translate(0,-6)");
    var dots = [[25, 50], [35, 55], [45, 50], [30, 60], [40, 60]];
    for (var i = 0; i < dots.length; i++) { b += '<circle cx="' + dots[i][0] + '" cy="' + dots[i][1] + '" r="2.8" fill="#fff" stroke="#8f9bd6" stroke-width="1"/>'; }
  }
  else { b = cloudSvg("#b3bde6", "translate(0,-8)") + '<polygon points="34,38 26,52 33,52 30,62 43,46 35,46 40,38" fill="#ffc83d" stroke="#e0a000" stroke-width="1" stroke-linejoin="round"/>'; }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' + b + '</svg>';
}
function wxText(c) { return WXLABEL[c] || "Weather"; }

/* ---- weather (Open-Meteo, no key) with offline cache ---- */
function wxKey() { return S.lat + "," + S.lon + "," + S.units; }
function wxUrl() {
  return "https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon +
    "&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    "&timezone=auto&forecast_days=5&temperature_unit=" + (S.units === "fahrenheit" ? "fahrenheit" : "celsius");
}
function renderWx(j, stale, when) {
  var c = j.current, d = j.daily, deg = "°";
  $("wIcon").innerHTML = wxIcon(c.weather_code);
  $("wTemp").textContent = Math.round(c.temperature_2m) + deg;
  $("wDesc").textContent = wxText(c.weather_code);
  $("wFeels").textContent = "Feels like " + Math.round(c.apparent_temperature) + deg + "  ·  H " + Math.round(d.temperature_2m_max[0]) + deg + "  L " + Math.round(d.temperature_2m_min[0]) + deg;
  var t = timeStr(zoned(new Date(when || Date.now())));
  $("wPlace").textContent = S.place + "  ·  " + (stale ? "offline, from " : "updated ") + t.t + " " + t.ap;
  var html = "";
  for (var i = 0; i < d.time.length && i < 5; i++) {
    var p = d.time[i].split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var name = i === 0 ? "Today" : dt.toLocaleDateString(undefined, { weekday:"short" });
    html += '<div class="day"><div class="dName">' + name + '</div><div class="dIcon">' + wxIcon(d.weather_code[i]) +
      '</div><div class="dLab">' + wxText(d.weather_code[i]) + '</div><div class="dTemps">' + Math.round(d.temperature_2m_max[i]) + deg + ' <span>' + Math.round(d.temperature_2m_min[i]) + deg + '</span></div></div>';
  }
  $("forecast").innerHTML = html;
  renderHourly(j);
}
var fcInit = false, fcMode = 0;
function setFc(m) {
  fcMode = m;
  var a = $("forecast"), b = $("hourly");
  a.classList.toggle("hidden", m === 1); b.classList.toggle("hidden", m === 0);
  var on = m === 1 ? b : a; on.classList.remove("fadein"); void on.offsetWidth; on.classList.add("fadein");
}
function renderHourly(j) {
  var h = j.hourly;
  if (!h || !h.time || !j.current || !j.current.time) { $("hourly").innerHTML = ""; setFc(0); return; }
  var key = j.current.time.slice(0, 13), start = 0, i;
  for (i = 0; i < h.time.length; i++) { if (h.time[i].slice(0, 13) >= key) { start = i; break; } }
  var html = "";
  for (i = start; i < start + 12 && i < h.time.length; i++) {
    var hr = +h.time[i].slice(11, 13);
    var lab = i === start ? "Now" : (S.hour12 ? ((hr % 12 || 12) + (hr >= 12 ? " PM" : " AM")) : pad2(hr) + ":00");
    var pop = h.precipitation_probability ? h.precipitation_probability[i] : null;
    html += '<div class="hr"><div class="hName">' + lab + '</div><div class="hIcon">' + wxIcon(h.weather_code[i]) + '</div><div class="hTemp">' + Math.round(h.temperature_2m[i]) + "&deg;" + '</div><div class="hPop">' + ((pop !== null && pop !== undefined && pop >= 10) ? pop + "%" : "") + '</div></div>';
  }
  $("hourly").innerHTML = html;
  if (!fcInit) { fcInit = true; setFc(1); }
}
setInterval(function () { if ($("hourly").innerHTML) { setFc(fcMode ? 0 : 1); } }, 12000);
var wxLast = 0;
function loadWeather() {
  var key = wxKey();
  try { var c0 = JSON.parse(lsGet("tvWx") || "null"); if (c0 && c0.key === key && c0.data && c0.data.current) { renderWx(c0.data, false, c0.t); } } catch (e) {}
  fetch(wxUrl()).then(function (r) { if (!r.ok) { throw new Error("bad"); } return r.json(); }).then(function (j) {
    wxLast = Date.now();
    lsSet("tvWx", JSON.stringify({ key:key, t:Date.now(), data:j }));
    renderWx(j, false, Date.now());
  }).catch(function () {
    var c = null;
    try { c = JSON.parse(lsGet("tvWx") || "null"); } catch (e) {}
    if (c && c.key === key) { renderWx(c.data, true, c.t); }
    else { $("wIcon").innerHTML = ""; $("wDesc").textContent = "Weather unavailable"; $("wFeels").textContent = ""; $("wPlace").textContent = S.place; $("forecast").innerHTML = ""; }
  });
}
loadWeather(); setInterval(loadWeather, 10 * 60 * 1000);
/* keep time and weather fresh even if the TV paused the app: refresh on resume, and re-check every minute */
function refreshNow() { tick(); if (Date.now() - wxLast > 5 * 60 * 1000) { loadWeather(); } }
document.addEventListener("visibilitychange", function () { if (!document.hidden) { refreshNow(); } });
window.addEventListener("focus", refreshNow);
document.addEventListener("webOSRelaunch", refreshNow);
window.addEventListener("online", function () { loadWeather(); });
setInterval(function () { tick(); if (Date.now() - wxLast > 20 * 60 * 1000) { loadWeather(); } }, 60000);

/* ---- tiles ---- */
var MUSIC_INDEX = -1;
/* Launch a real TV app when running as an installed LG app (PalmServiceBridge exists); otherwise the tile just opens the web page. */
function launchApp(id, fail, params) {
  try {
    var b = new window.PalmServiceBridge();
    b.onservicecallback = function (r) { try { var o = JSON.parse(r); if (o.returnValue === false) { fail(); } } catch (e) { fail(); } };
    b.call("luna://com.webos.applicationManager/launch", JSON.stringify(params ? { id: id, params: params } : { id: id }));
  } catch (e) { fail(); }
}
function buildTiles() {
  var m = $("tiles"), w = Math.min(440, Math.floor(1700 / TILES.length) - 44);
  TILES.forEach(function (t, i) {
    var a = document.createElement("a");
    a.className = "tile f" + (w < 340 ? " sm" : ""); a.id = "tile" + i; a.setAttribute("tabindex", "0");
    a.style.width = w + "px";
    if (t.action === "music") { a.href = "#"; MUSIC_INDEX = i; a.addEventListener("click", function (e) { e.preventDefault(); if (window.PalmServiceBridge && t.appId) { toast("Opening " + t.name + "…"); launchApp(t.appId, openMusic); } else { openMusic(); } }); }
    else if (!t.url) { a.href = "#"; a.addEventListener("click", function (e) { e.preventDefault(); if (window.PalmServiceBridge && t.appId) { toast("Switching to " + t.name + "…"); launchApp(t.appId, function () { toast("Couldn't open " + t.name); }); } else { toast(t.name + " only works in the TV app"); } }); }
    else { a.href = t.url; if (t.appId) { a.addEventListener("click", function (e) { if (window.PalmServiceBridge) { e.preventDefault(); toast("Opening " + t.name + "…"); launchApp(t.appId, function () { location.href = t.url; }, t.appParams); } }); } }
    a.innerHTML = '<span class="num">' + (i + 1) + '</span><div class="logo" style="background:' + t.color + (t.small ? ';font-size:44px' : '') + '">' + t.letter + '</div><div class="tname">' + t.name + '</div>';
    a.addEventListener("mouseenter", function () { a.focus(); });
    m.appendChild(a);
  });
}
buildTiles();
/* pause the background motion while someone is using the screen, so button presses feel instant */
(function () {
  var t = null;
  function busy() { document.body.classList.add("busy"); clearTimeout(t); t = setTimeout(function () { document.body.classList.remove("busy"); }, 6000); }
  document.addEventListener("keydown", busy); document.addEventListener("mousemove", busy); document.addEventListener("click", busy);
})();
/* pointer (Magic Remote / mouse): hovering any control highlights it, no click needed */
document.addEventListener("mouseover", function (e) { var el = e.target; while (el && el !== document.body) { if (el.classList && el.classList.contains("f") && el.focus) { if (document.activeElement !== el) { el.focus(); } return; } el = el.parentNode; } });

/* ---- themes ---- */
function autoTheme() { var h = zoned(new Date()).getHours(); return (h >= 6 && h < 18) ? "ocean" : "midnight"; }
function applyTheme() {
  document.body.setAttribute("data-theme", S.theme === "auto" ? autoTheme() : S.theme);
  THEMES.forEach(function (t) { var el = $("sw_" + t.id); if (el) { el.className = "sw f" + (t.id === S.theme ? " sel" : ""); } });
}
function setTheme(id, name) { S.theme = id; save(); applyTheme(); toast("Theme: " + name); }
function nextTheme() {
  var i = 0; THEMES.forEach(function (t, n) { if (t.id === S.theme) { i = n; } });
  var t = THEMES[(i + 1) % THEMES.length]; setTheme(t.id, t.name);
}
function buildSwatches() {
  var box = $("swatches");
  THEMES.forEach(function (t) {
    var b = document.createElement("button");
    b.id = "sw_" + t.id; b.className = "sw f"; b.setAttribute("tabindex", "0"); b.setAttribute("aria-label", t.name);
    b.style.background = t.c;
    b.addEventListener("click", function () { setTheme(t.id, t.name); });
    box.appendChild(b);
  });
}
buildSwatches(); applyTheme();

var toastT = null;
function toast(msg) {
  $("toastMsg").textContent = msg; $("toast").className = "show";
  clearTimeout(toastT); toastT = setTimeout(function () { $("toast").className = ""; }, 1800);
}

/* ---- overlays (settings, music, phone) ---- */
function openOverlay(id, focusId, opener) { overlay = $(id); openerId = opener; overlay.className = "overlay"; $(focusId).focus(); }
function closeOverlay() {
  if (!overlay) { return; }
  if (overlay.id === "musicPanel") { $("spFrame").src = "about:blank"; }
  overlay.className = "overlay hidden"; overlay = null;
  var o = openerId && $(openerId); if (o) { o.focus(); }
}

/* ---- settings ---- */
var IDLE_OPTS = [0, 5, 15, 30];
function labels() {
  $("unitsBtn").textContent = S.units === "fahrenheit" ? "Fahrenheit (°F)" : "Celsius (°C)";
  $("clockBtn").textContent = S.hour12 ? "12-hour" : "24-hour";
  var tzName = "Same as the TV"; for (var z = 0; z < TZS.length; z++) { if (TZS[z][0] === (S.tz || "")) { tzName = TZS[z][1]; } }
  $("tzBtn").textContent = tzName;
  $("animBtn").textContent = S.anim ? "On" : "Off";
  $("idleBtn").textContent = S.idleMin ? S.idleMin + " minutes" : "Never";
  document.body.className = (S.anim ? "" : "noanim ") + (document.body.className.indexOf("idle") >= 0 ? "idle" : "");
}
$("setBtn").addEventListener("click", function () { labels(); openOverlay("panel", "unitsBtn", "setBtn"); });
$("doneBtn").addEventListener("click", closeOverlay);
$("unitsBtn").addEventListener("click", function () { S.units = S.units === "fahrenheit" ? "celsius" : "fahrenheit"; save(); labels(); loadWeather(); });
$("tzBtn").addEventListener("click", function () { var k = 0; for (var z = 0; z < TZS.length; z++) { if (TZS[z][0] === (S.tz || "")) { k = z; } } S.tz = TZS[(k + 1) % TZS.length][0]; save(); labels(); tick(); loadWeather(); });
$("clockBtn").addEventListener("click", function () { S.hour12 = !S.hour12; save(); labels(); tick(); });
$("animBtn").addEventListener("click", function () { S.anim = !S.anim; save(); labels(); });
$("idleBtn").addEventListener("click", function () {
  var i = IDLE_OPTS.indexOf(S.idleMin); S.idleMin = IDLE_OPTS[(i + 1) % IDLE_OPTS.length]; save(); labels();
});
function findCity() {
  var q = $("cityIn").value.replace(/^\s+|\s+$/g, ""), msg = $("cityMsg");
  if (!q) { return; }
  msg.textContent = "Searching…";
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=" + encodeURIComponent(q))
    .then(function (r) { return r.json(); }).then(function (j) {
      if (!j.results || !j.results.length) { msg.textContent = "No match for “" + q + "”"; return; }
      var r = j.results[0];
      S.place = r.name + (r.admin1 ? ", " + r.admin1 : ""); S.lat = r.latitude; S.lon = r.longitude; save();
      msg.textContent = "Weather set to " + S.place; loadWeather();
    }).catch(function () { msg.textContent = "Could not search (check internet)"; });
}
$("cityGo").addEventListener("click", findCity);
$("cityIn").addEventListener("keydown", function (e) { if (e.keyCode === 13) { findCity(); } });

/* ---- Spotify ---- */
function spotifyEmbed(url) {
  var m = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/.exec(url || "");
  return m ? "https://open.spotify.com/embed/" + m[1] + "/" + m[2] + "?utm_source=generator&theme=0" : null;
}
function openMusic() {
  $("spFrame").src = spotifyEmbed(S.spotify) || spotifyEmbed(DEFAULTS.spotify);
  openOverlay("musicPanel", "spClose", "tile" + MUSIC_INDEX);
}
$("spClose").addEventListener("click", closeOverlay);
function saveSpotify() {
  var v = $("spIn").value.replace(/^\s+|\s+$/g, ""), msg = $("spMsg");
  if (!v) { return; }
  if (!spotifyEmbed(v)) { msg.textContent = "That doesn't look like a Spotify playlist, album or song link."; return; }
  S.spotify = v; save(); msg.textContent = "Saved. Open Spotify to see it.";
}
$("spGo").addEventListener("click", saveSpotify);
if (window.PalmServiceBridge) { $("spRow").style.display = "none"; $("spMsg").style.display = "none"; }
$("spIn").addEventListener("keydown", function (e) { if (e.keyCode === 13) { saveSpotify(); } });


/* ---- idle: dim + slowly shift pixels (protects OLED/LCD from burn-in) ---- */
function wake() { lastActive = Date.now(); document.body.className = document.body.className.replace(/\s*idle/, ""); }
setInterval(function () {
  if (S.idleMin > 0 && Date.now() - lastActive > S.idleMin * 60000 && document.body.className.indexOf("idle") < 0) { document.body.className += " idle"; }
}, 5000);
var SHIFTS = [[0,0],[6,4],[-5,7],[4,-6],[-7,-3]], shiftI = 0;
setInterval(function () { shiftI = (shiftI + 1) % SHIFTS.length; $("shift").style.transform = "translate(" + SHIFTS[shiftI][0] + "px," + SHIFTS[shiftI][1] + "px)"; }, 60000);
addEventListener("mousemove", function () { if (document.body.className.indexOf("idle") >= 0) { wake(); } else { lastActive = Date.now(); } });
setInterval(function () { if (zoned(new Date()).getHours() === 4 && Date.now() - bootT > 6 * 3600000) { location.reload(); } }, 60000);

/* ---- navigation: shared by the TV remote and the phone remote ---- */
function focusables() {
  var root = overlay || $("shift"), list = root.querySelectorAll('[tabindex="0"]'), out = [];
  for (var i = 0; i < list.length; i++) { if (list[i].offsetParent !== null) { out.push(list[i]); } }
  return out;
}
function center(el) { var r = el.getBoundingClientRect(); return { x:r.left + r.width / 2, y:r.top + r.height / 2 }; }
function move(d) {
  var a = document.activeElement, list = focusables();
  if (list.indexOf(a) < 0) { if (list.length) { list[0].focus(); } return; }
  var c = center(a), best = null, bestScore = 1e12;
  list.forEach(function (el) {
    if (el === a) { return; }
    var p = center(el), dx = p.x - c.x, dy = p.y - c.y, along = dx * d[0] + dy * d[1];
    if (along <= 0) { return; }
    var across = Math.abs(dx * d[1]) + Math.abs(dy * d[0]), score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) { best.focus(); }
}
var DIRS = { 37:[-1, 0], 38:[0, -1], 39:[1, 0], 40:[0, 1] };
var KEYDIR = { left:[-1, 0], up:[0, -1], right:[1, 0], down:[0, 1] };
addEventListener("keydown", function (e) {
  var k = e.keyCode, a = document.activeElement, inInput = a && a.tagName === "INPUT";
  if (document.body.className.indexOf("idle") >= 0) { wake(); e.preventDefault(); return; }
  lastActive = Date.now();
  if (k === 27 || k === 461 || k === 10009 || (k === 8 && !inInput)) { if (overlay) { closeOverlay(); e.preventDefault(); } return; }
  if (!overlay && !inInput && ((k >= 49 && k <= 57) || (k >= 97 && k <= 105))) {
    var n = k >= 97 ? k - 97 : k - 49, t = $("tile" + n);
    if (t) { t.click(); }
    return;
  }
  var d = DIRS[k];
  if (!d) { return; }
  if (inInput && (k === 37 || k === 39)) { return; }
  e.preventDefault(); move(d);
});

/* ---- small QR code: opens the phone remote (remote.html) when scanned ---- */
(function () {
  var URL = "https://unorthodox15.github.io/tv-dashboard/remote.html";
  function draw() {
    try { var q = window.qrcode(0, "M"); q.addData(URL); q.make(); $("qrImg").innerHTML = q.createSvgTag(4, 0); $("qrBox").className = ""; } catch (e) {}
  }
  var sc = document.createElement("script");
  sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  sc.onload = draw; document.head.appendChild(sc);
})();

/* ---- remember the selected control (so coming back from an app lands in the same place) ---- */
document.addEventListener("focusin", function (e) {
  if (!overlay && e.target && e.target.id && $("shift").contains(e.target)) { lsSet("tvFocus", e.target.id); }
});
var first = $(lsGet("tvFocus") || "tile0") || $("tile0");
first.focus();
labels();
})();
</script>
