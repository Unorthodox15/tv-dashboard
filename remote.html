<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>html,body{margin:0;height:100%;background:#0f1226}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="f" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" allow="local-network-access *; local-network *; loopback-network *" title="TV Remote"></iframe>
<script>
/* The TV only accepts control connections from pages with no web origin (like a local file). A sandboxed frame has exactly that, so the remote runs inside one. This outer page only stores the saved TV address and key. */
(function () {
  var INNER = "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no\">\n<meta name=\"theme-color\" content=\"#0f1226\"><title>TV Remote<\/title>\n<style>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}\nhtml,body{margin:0;background:#0f1226;color:#eef;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation}\nbody{min-height:100vh;padding:14px 14px 30px;max-width:460px;margin:0 auto}\nh1{font-size:19px;font-weight:600;margin:6px 0 2px;text-align:center}\n#st{text-align:center;font-size:14px;color:#9aa;min-height:20px;margin-bottom:10px}\n#st.ok{color:#7fe3a1}#st.bad{color:#ff9b9b}\n.card{background:#1a1f3d;border-radius:18px;padding:14px;margin-bottom:12px}\n.card p{margin:6px 0;font-size:14px;color:#b9bfe0;line-height:1.4}\ninput{width:100%;font-size:18px;padding:12px;border-radius:12px;border:0;background:#262c55;color:#fff;margin:6px 0}\nbutton{font:inherit;color:#fff;border:0;border-radius:16px;background:#2a3166;font-size:18px;min-height:56px;width:100%;touch-action:manipulation}\nbutton:active{background:#4a55b8}\na.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#2a3166;border-radius:16px;padding:16px;margin:8px 0;font-size:17px}\n.pri{background:#7c8cff;color:#10142e;font-weight:600}\n.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:10px}\n.row{display:grid;grid-gap:10px;margin-top:10px}\n.r2{grid-template-columns:repeat(2,1fr)}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}\n.dp button{min-height:74px;font-size:26px}\n.ok{}#bOk{background:#7c8cff;color:#10142e;font-weight:700}\n.sm{font-size:15px;min-height:50px}\n.pw{background:#5a2236}\n.hid{display:none}\n.lab{font-size:12px;letter-spacing:2px;color:#8a90b8;margin:14px 2px 6px}\n#pad{height:120px;border-radius:16px;background:#1a1f3d;display:flex;align-items:center;justify-content:center;color:#6b72a0;font-size:14px;touch-action:none;margin-top:10px}\n<\/style><\/head><body>\n<h1>TV Remote<\/h1><div id=\"st\">Starting\u2026<\/div>\n\n<div id=\"setup\" class=\"card hid\">\n  <p><b>One-time setup<\/b> (same Wi-Fi as the TV)<\/p>\n  <p>TV address<\/p><input id=\"ip\" inputmode=\"decimal\" placeholder=\"192.168.1.78\" autocomplete=\"off\">\n  <a class=\"btn\" id=\"trust\" target=\"_blank\" rel=\"noopener\">1. Trust the TV (opens a page that says \u201cHello world\u201d)<\/a>\n  <p style=\"font-size:13px\">On that page tap Advanced \u2192 Proceed. When it says \u201cHello world\u201d, come back here.<\/p>\n  <button class=\"pri\" id=\"go\">2. Connect<\/button>\n  <p style=\"font-size:13px\">The TV will ask \u201callow this device?\u201d \u2014 press OK on the TV remote.<\/p>\n<\/div>\n\n<div id=\"rem\" class=\"hid\">\n  <div class=\"grid dp\">\n    <button class=\"sm\" data-p=\"HOME\">Home<\/button><button data-p=\"UP\" data-rep=\"1\">\u25b2<\/button><button class=\"sm\" data-p=\"BACK\">Back<\/button>\n    <button data-p=\"LEFT\" data-rep=\"1\">\u25c0<\/button><button id=\"bOk\" data-p=\"ENTER\">OK<\/button><button data-p=\"RIGHT\" data-rep=\"1\">\u25b6<\/button>\n    <button class=\"sm\" data-p=\"MENU\">Menu<\/button><button data-p=\"DOWN\" data-rep=\"1\">\u25bc<\/button><button class=\"sm\" data-p=\"EXIT\">Exit<\/button>\n  <\/div>\n  <div class=\"row r4\">\n    <button class=\"sm\" data-u=\"ssap://audio/volumeDown\" data-rep=\"1\">Vol \u2212<\/button>\n    <button class=\"sm\" id=\"bMute\">Mute<\/button>\n    <button class=\"sm\" data-u=\"ssap://audio/volumeUp\" data-rep=\"1\">Vol +<\/button>\n    <button class=\"sm pw\" id=\"bPow\">Power<\/button>\n  <\/div>\n  <div class=\"row r4\">\n    <button class=\"sm\" data-u=\"ssap://media.controls/rewind\">\u23ea<\/button>\n    <button class=\"sm\" data-u=\"ssap://media.controls/play\">\u25b6<\/button>\n    <button class=\"sm\" data-u=\"ssap://media.controls/pause\">\u23f8<\/button>\n    <button class=\"sm\" data-u=\"ssap://media.controls/fastForward\">\u23e9<\/button>\n  <\/div>\n  <div class=\"lab\">OPEN<\/div>\n  <div class=\"row r3\">\n    <button class=\"sm\" data-app=\"com.callum.tvhome\">TV Home<\/button>\n    <button class=\"sm\" data-app=\"netflix\">Netflix<\/button>\n    <button class=\"sm\" data-app=\"youtube.leanback.v4\">YouTube<\/button>\n    <button class=\"sm\" data-app=\"amazon\">Prime<\/button>\n    <button class=\"sm\" data-app=\"spotify-beehive\">Spotify<\/button>\n    <button class=\"sm\" data-in=\"HDMI_2\">PS5<\/button>\n  <\/div>\n  <div class=\"lab\">TOUCHPAD<\/div>\n  <div id=\"pad\">Drag to move the pointer \u00b7 tap to click<\/div>\n  <div class=\"row r2\" style=\"margin-top:14px\"><button class=\"sm\" id=\"bFor\">Forget this TV<\/button><button class=\"sm\" id=\"bRe\">Reconnect<\/button><\/div>\n<\/div>\n\n<script>\n(function () {\n  var $ = function (i) { return document.getElementById(i); };\n  var INIT = window.__INIT || {};\n  var LS = { get: function (k) { return INIT[k] || \"\"; }, set: function (k, v) { INIT[k] = v; try { parent.postMessage({ t: \"set\", k: k, v: v }, \"*\"); } catch (e) {} }, del: function (k) { delete INIT[k]; try { parent.postMessage({ t: \"del\", k: k }, \"*\"); } catch (e) {} } };\n  var ip = LS.get(\"tvIp\") || \"192.168.1.78\", key = LS.get(\"tvKey\");\n  var ws = null, ps = null, nid = 1, pend = {}, ready = false, pointerWant = null, wantOpen = true, retry = 0, muteState = false;\n  var MANIFEST = { manifestVersion: 1, appVersion: \"1.1.0\", permissions: [\"LAUNCH\",\"LAUNCH_WEBAPP\",\"CONTROL_AUDIO\",\"CONTROL_POWER\",\"CONTROL_INPUT_TEXT\",\"CONTROL_MOUSE_AND_KEYBOARD\",\"CONTROL_INPUT_MEDIA_PLAYBACK\",\"CONTROL_INPUT_TV\",\"CONTROL_INPUT_JOYSTICK\",\"CONTROL_DISPLAY\",\"READ_INSTALLED_APPS\",\"READ_RUNNING_APPS\",\"READ_INPUT_DEVICE_LIST\",\"WRITE_NOTIFICATION_TOAST\"] };\n  function st(m, c) { $(\"st\").textContent = m; $(\"st\").className = c || \"\"; }\n  function show(setup) { $(\"setup\").className = \"card\" + (setup ? \"\" : \" hid\"); $(\"rem\").className = setup ? \"hid\" : \"\"; }\n  function buzz() { try { if (navigator.vibrate) { navigator.vibrate(8); } } catch (e) {} }\n\n  function send(uri, payload, cb) {\n    if (!ws || ws.readyState !== 1 || !ready) { st(\"Not connected \u2014 tap Reconnect\", \"bad\"); return; }\n    var id = \"r\" + (nid++); if (cb) { pend[id] = cb; }\n    var m = { type: \"request\", id: id, uri: uri }; if (payload) { m.payload = payload; }\n    ws.send(JSON.stringify(m));\n  }\n  function openPointer(then) {\n    if (ps && ps.readyState === 1) { then(); return; }\n    pointerWant = then;\n    if (ps && ps.readyState === 0) { return; }\n    send(\"ssap://com.webos.service.networkinput/getPointerInputSocket\", null, function (r) {\n      if (!r || !r.payload || !r.payload.socketPath) { st(\"Buttons not allowed by the TV\", \"bad\"); return; }\n      try {\n        ps = new WebSocket(r.payload.socketPath);\n        ps.onopen = function () { if (pointerWant) { var f = pointerWant; pointerWant = null; f(); } };\n        ps.onclose = function () { ps = null; };\n        ps.onerror = function () { st(\"Button channel failed\", \"bad\"); };\n      } catch (e) { st(\"Button channel failed\", \"bad\"); }\n    });\n  }\n  function btn(name) { openPointer(function () { try { ps.send(\"type:button\\nname:\" + name + \"\\n\\n\"); } catch (e) {} }); }\n  function conn() {\n    wantOpen = true; ready = false;\n    try { if (ws) { ws.onclose = null; ws.close(); } } catch (e) {}\n    st(\"Connecting to \" + ip + \"\u2026\");\n    try { ws = new WebSocket(\"wss://\" + ip + \":3001\"); } catch (e) { st(\"Could not start: \" + e.message, \"bad\"); show(true); return; }\n    var opened = false, me = ws;\n    ws.onopen = function () {\n      opened = true;\n      var p = { forcePairing: false, pairingType: \"PROMPT\", manifest: MANIFEST }; if (key) { p[\"client-key\"] = key; }\n      ws.send(JSON.stringify({ type: \"register\", id: \"reg\", payload: p }));\n    };\n    ws.onmessage = function (e) {\n      var d; try { d = JSON.parse(e.data); } catch (x) { return; }\n      if (d.type === \"response\" && d.id === \"reg\" && d.payload && d.payload.pairingType) { st(\"Press OK on the TV to allow this phone\u2026\"); return; }\n      if (d.type === \"registered\") {\n        key = d.payload && d.payload[\"client-key\"] || key; LS.set(\"tvKey\", key); LS.set(\"tvIp\", ip);\n        ready = true; retry = 0; show(false); st(\"Connected\", \"ok\"); return;\n      }\n      if (d.type === \"error\" && d.id === \"reg\") { st(\"The TV refused: \" + (d.error || \"error\"), \"bad\"); key = \"\"; LS.del(\"tvKey\"); return; }\n      var cb = pend[d.id]; if (cb) { if (d.type !== \"error\") { delete pend[d.id]; cb(d); } else { delete pend[d.id]; st((d.error || \"error\").replace(/^\\d+\\s*/, \"\"), \"bad\"); } }\n    };\n    ws.onerror = function () {};\n    ws.onclose = function () {\n      if (me !== ws) { return; }\n      ready = false; ps = null;\n      if (!opened) { st(\"Can't reach the TV. Same Wi-Fi? TV on? Trust step done?\", \"bad\"); show(true); }\n      else if (wantOpen) { st(\"Reconnecting\u2026\"); retry++; setTimeout(function () { if (wantOpen && !ready) { conn(); } }, Math.min(1000 * retry, 5000)); }\n    };\n  }\n\n  function press(el) {\n    var p = el.getAttribute(\"data-p\"), u = el.getAttribute(\"data-u\"), app = el.getAttribute(\"data-app\"), inp = el.getAttribute(\"data-in\");\n    buzz();\n    if (p) { btn(p); } else if (u) { send(u); }\n    else if (app) { send(\"ssap://system.launcher/launch\", { id: app }); }\n    else if (inp) { send(\"ssap://tv/switchInput\", { inputId: inp }); }\n  }\n  var rt = null, rt2 = null;\n  function stopRep() { clearTimeout(rt); clearInterval(rt2); rt = rt2 = null; }\n  function bind(el) {\n    var rep = el.getAttribute(\"data-rep\");\n    el.addEventListener(\"pointerdown\", function (e) {\n      e.preventDefault(); press(el);\n      if (rep) { stopRep(); rt = setTimeout(function () { rt2 = setInterval(function () { press(el); }, 120); }, 380); }\n    });\n    [\"pointerup\", \"pointerleave\", \"pointercancel\"].forEach(function (n) { el.addEventListener(n, stopRep); });\n  }\n  var bs = document.querySelectorAll(\"[data-p],[data-u],[data-app],[data-in]\");\n  for (var i = 0; i < bs.length; i++) { bind(bs[i]); }\n\n  $(\"bMute\").addEventListener(\"click\", function () { buzz(); send(\"ssap://audio/getStatus\", null, function (r) { var m = r.payload && (r.payload.mute === true || (r.payload.volumeStatus && r.payload.volumeStatus.muteStatus === true)); send(\"ssap://audio/setMute\", { mute: !m }); }); });\n  var powArm = 0;\n  $(\"bPow\").addEventListener(\"click\", function () { if (powArm) { powArm = 0; $(\"bPow\").textContent = \"Power\"; send(\"ssap://system/turnOff\"); } else { powArm = 1; $(\"bPow\").textContent = \"Tap again\"; setTimeout(function () { powArm = 0; $(\"bPow\").textContent = \"Power\"; }, 3000); } });\n  $(\"bRe\").addEventListener(\"click\", function () { conn(); });\n  $(\"bFor\").addEventListener(\"click\", function () { wantOpen = false; try { ws.close(); } catch (e) {} key = \"\"; LS.del(\"tvKey\"); show(true); st(\"Forgotten. Set up again below.\"); });\n  $(\"go\").addEventListener(\"click\", function () { var v = $(\"ip\").value.replace(/\\s/g, \"\"); if (!/^\\d{1,3}(\\.\\d{1,3}){3}$/.test(v)) { st(\"Enter the TV's address like 192.168.1.78\", \"bad\"); return; } ip = v; LS.set(\"tvIp\", ip); conn(); });\n  $(\"ip\").value = ip;\n  $(\"ip\").addEventListener(\"input\", function () { $(\"trust\").href = \"https://\" + $(\"ip\").value.replace(/\\s/g, \"\") + \":3001/\"; });\n  $(\"trust\").href = \"https://\" + ip + \":3001/\";\n\n  var pad = $(\"pad\"), last = null, moved = false, startT = 0;\n  pad.addEventListener(\"pointerdown\", function (e) { last = [e.clientX, e.clientY]; moved = false; startT = Date.now(); try { pad.setPointerCapture(e.pointerId); } catch (x) {} });\n  pad.addEventListener(\"pointermove\", function (e) { if (!last) { return; } var dx = Math.round((e.clientX - last[0]) * 2), dy = Math.round((e.clientY - last[1]) * 2); if (dx || dy) { moved = true; last = [e.clientX, e.clientY]; openPointer(function () { try { ps.send(\"type:move\\ndx:\" + dx + \"\\ndy:\" + dy + \"\\ndown:0\\n\\n\"); } catch (x) {} }); } });\n  pad.addEventListener(\"pointerup\", function () { if (last && !moved && Date.now() - startT < 400) { buzz(); openPointer(function () { try { ps.send(\"type:click\\n\\n\"); } catch (x) {} }); } last = null; });\n\n  document.addEventListener(\"visibilitychange\", function () { if (!document.hidden && wantOpen && key && (!ws || ws.readyState !== 1 || !ready)) { conn(); } });\n  window.addEventListener(\"online\", function () { if (key) { conn(); } });\n  if (key) { show(false); conn(); } else { show(true); st(\"Set up your TV below\"); }\n})();\n<\/script><\/body><\/html>\n";
  var init = {};
  try { init.tvIp = localStorage.getItem("tvIp") || ""; init.tvKey = localStorage.getItem("tvKey") || ""; } catch (e) {}
  var f = document.getElementById("f");
  f.srcdoc = "<scr" + "ipt>window.__INIT=" + JSON.stringify(init).replace(/</g, "\\u003c") + ";</scr" + "ipt>" + INNER;
  window.addEventListener("message", function (e) {
    if (e.source !== f.contentWindow || !e.data) { return; }
    try {
      if (e.data.t === "set" && (e.data.k === "tvIp" || e.data.k === "tvKey")) { localStorage.setItem(e.data.k, String(e.data.v)); }
      else if (e.data.t === "del" && (e.data.k === "tvIp" || e.data.k === "tvKey")) { localStorage.removeItem(e.data.k); }
    } catch (x) {}
  });
})();
